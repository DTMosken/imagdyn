<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMagDyn Map Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #12161c;
      --panel: #1a212b;
      --panel-edge: #2a3544;
      --ink: #e8eef4;
      --muted: #8b9aab;
      --accent: #d4a574;
      --accent-dim: #a67c52;
      --pin: #e07a5f;
      --cross: rgba(212, 165, 116, 0.85);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      --font-ui: "Syne", system-ui, sans-serif;
      --font-data: "IBM Plex Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
      background:
        radial-gradient(1200px 600px at 10% -10%, #243044 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #2a2218 0%, transparent 50%),
        var(--bg);
    }

    header {
      display: flex;
      align-items: center;
      gap: 0.85rem 1.1rem;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--panel-edge);
      background: rgba(18, 22, 28, 0.85);
      backdrop-filter: blur(10px);
      z-index: 5;
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .brand span { color: var(--accent); }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem 0.85rem;
      flex: 1;
      min-width: 0;
    }

    label.ctrl {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    select, button {
      font-family: var(--font-data);
      font-size: 0.8rem;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      border-radius: 6px;
      padding: 0.4rem 0.65rem;
      outline: none;
    }

    select { min-width: 16rem; cursor: pointer; }
    select:hover, button:hover { border-color: var(--accent-dim); }
    button { cursor: pointer; }
    button:active { transform: translateY(1px); }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      user-select: none;
    }

    .toggle input { accent-color: var(--accent); width: 1rem; height: 1rem; }

    .header-end {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-left: auto;
      flex-shrink: 0;
    }

    .hint {
      font-family: var(--font-data);
      font-size: 0.7rem;
      color: var(--muted);
      white-space: nowrap;
    }

    #btnLang {
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #12161c;
      background: var(--accent);
      border-color: var(--accent);
      min-width: 3.6rem;
      text-align: center;
    }

    #btnLang:hover {
      background: #e0b88a;
      border-color: #e0b88a;
    }

    html[lang="en"] header {
      gap: 0.65rem 0.85rem;
    }

    html[lang="en"] .controls {
      gap: 0.5rem 0.7rem;
    }

    html[lang="en"] label.ctrl {
      font-size: 0.66rem;
      letter-spacing: 0.02em;
    }

    html[lang="en"] select,
    html[lang="en"] button {
      font-size: 0.72rem;
    }

    html[lang="en"] select { min-width: 13.5rem; }

    html[lang="en"] .hint {
      font-size: 0.62rem;
      max-width: 16.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    html[lang="en"] #btnLang {
      font-size: 0.8rem;
    }

    main {
      position: relative;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr auto;
    }

    .viewport {
      position: relative;
      overflow: hidden;
      cursor: crosshair;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      background-position: center;
    }

    .viewport.panning { cursor: grabbing; }

    #mapCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .crosshair {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .crosshair.on { opacity: 1; }
    .crosshair .h, .crosshair .v {
      position: absolute;
      background: var(--cross);
    }
    .crosshair .h { left: 0; right: 0; height: 1px; top: 50%; }
    .crosshair .v { top: 0; bottom: 0; width: 1px; left: 50%; }
    .crosshair .dot {
      position: absolute;
      left: 50%; top: 50%;
      width: 7px; height: 7px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      background: transparent;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
      transform: translate(-50%, -50%);
    }

    .pin-marker {
      position: absolute;
      width: 14px; height: 14px;
      margin: -7px 0 0 -7px;
      border-radius: 50%;
      border: 2px solid var(--pin);
      background: rgba(224, 122, 95, 0.25);
      box-shadow: 0 0 0 2px rgba(0,0,0,0.35), var(--shadow);
      pointer-events: none;
      z-index: 3;
      display: none;
    }
    .pin-marker.on { display: block; }

    .month-nav {
      position: absolute;
      left: 50%;
      bottom: 1rem;
      transform: translateX(-50%);
      z-index: 4;
      display: none;
      align-items: center;
      gap: 0.65rem;
      padding: 0.45rem 0.7rem;
      background: rgba(18, 22, 28, 0.88);
      border: 1px solid var(--panel-edge);
      border-radius: 999px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      pointer-events: auto;
    }
    .month-nav.show { display: flex; }

    .month-nav button {
      min-width: 4.5rem;
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
    }

    .month-nav .month-label {
      font-family: var(--font-data);
      font-size: 0.82rem;
      color: var(--accent);
      min-width: 7.5rem;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .side {
      width: min(340px, 40vw);
      background: var(--panel);
      border-left: 1px solid var(--panel-edge);
      display: flex;
      flex-direction: column;
      z-index: 4;
      overflow: auto;
    }

    .card {
      padding: 1rem 1.1rem;
      border-bottom: 1px solid var(--panel-edge);
    }

    .card h2 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.65rem;
      font-weight: 600;
    }

    .card.pinned h2 { color: var(--pin); }

    .kv {
      font-family: var(--font-data);
      font-size: 0.78rem;
      line-height: 1.55;
      display: grid;
      grid-template-columns: 5.5rem 1fr;
      gap: 0.15rem 0.5rem;
    }

    .kv .k { color: var(--muted); }
    .kv .v { color: var(--ink); word-break: break-all; }
    .kv .v.emph { color: var(--accent); font-weight: 500; }

    .empty {
      font-family: var(--font-data);
      font-size: 0.75rem;
      color: var(--muted);
      font-style: italic;
    }

    #legendCard { display: block; }

    .legend-bar {
      height: 14px;
      border-radius: 3px;
      border: 1px solid var(--panel-edge);
      margin: 0.4rem 0 0.35rem;
    }

    .legend-labels {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-data);
      font-size: 0.68rem;
      color: var(--muted);
    }

    .legend-note {
      margin-top: 0.55rem;
      font-family: var(--font-data);
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .temp-chart-wrap {
      margin-top: 0.85rem;
      position: relative;
      overflow: visible;
    }

    .temp-chart-wrap .chart-title {
      font-family: var(--font-data);
      font-size: 0.68rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #pinChart {
      width: 100%;
      height: 120px;
      display: block;
      background: #12161c;
      border: 1px solid var(--panel-edge);
      border-radius: 6px;
      cursor: crosshair;
    }

    .chart-tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 50;
      display: none;
      padding: 0.3rem 0.5rem;
      background: rgba(18, 22, 28, 0.96);
      border: 1px solid var(--panel-edge);
      border-radius: 4px;
      font-family: var(--font-data);
      font-size: 0.72rem;
      color: var(--ink);
      white-space: nowrap;
      box-shadow: var(--shadow);
      max-width: min(240px, calc(100vw - 16px));
    }
    .chart-tooltip.show { display: block; }

    .status {
      font-family: var(--font-data);
      font-size: 0.68rem;
      color: var(--muted);
      padding: 0.75rem 1.1rem;
      margin-top: auto;
      border-top: 1px solid var(--panel-edge);
    }

    .status.warn { color: var(--pin); }

    .swatch {
      display: inline-block;
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 2px;
      border: 1px solid var(--panel-edge);
      vertical-align: -2px;
      margin-right: 0.35rem;
    }

    @media (max-width: 1100px) {
      html[lang="en"] .hint { display: none; }
    }

    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .side {
        width: 100%;
        max-height: 46vh;
        border-left: none;
        border-top: 1px solid var(--panel-edge);
      }
      header { flex-wrap: wrap; }
      .controls { flex-basis: 100%; }
      .hint { display: none; }
      .header-end { margin-left: auto; }
      select { min-width: 12rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">IMagDyn <span>Maps</span></div>
    <div class="controls">
      <label class="ctrl"><span data-i18n="layer">图层</span>
        <select id="layerSelect" aria-label="选择图层"></select>
      </label>
      <label class="toggle ctrl" data-i18n-title="colorScaleTitle" title="对地形/气温灰度图套用色阶显示">
        <input type="checkbox" id="colorScaleToggle" checked />
        <span data-i18n="colorScale">色阶</span>
      </label>
      <label class="toggle ctrl" data-i18n-title="graticuleTitle" title="叠加经纬网；赤道 / 回归线 / 极圈加粗">
        <input type="checkbox" id="graticuleToggle" />
        <span data-i18n="graticule">经纬度</span>
      </label>
      <label class="toggle ctrl" data-i18n-title="coastTitle" title="用 Land Mask 描边陆地边界">
        <input type="checkbox" id="coastToggle" checked />
        <span data-i18n="coast">陆地描边</span>
      </label>
      <label class="toggle ctrl" data-i18n-title="contourTitle" title="叠加等高线">
        <input type="checkbox" id="contourToggle" />
        <span data-i18n="contours">等高线</span>
      </label>
      <label class="toggle ctrl" data-i18n-title="windTitle" title="叠加风向箭头（需 graphs/wind UV）">
        <input type="checkbox" id="windArrowToggle" />
        <span data-i18n="wind">风向</span>
      </label>
      <button type="button" id="btnReset" data-i18n="reset" data-i18n-title="resetTitle" title="重置视图">重置视图</button>
      <button type="button" id="btnClearPin" data-i18n="clearPin" data-i18n-title="clearPinTitle" title="清除固定点">清除固定</button>
    </div>
    <div class="header-end">
      <div class="hint" data-i18n="hint">滚轮缩放 · 中键/右键拖拽 · 悬停读数 · 单击固定</div>
      <button type="button" id="btnLang" data-i18n="langBtn" data-i18n-title="langBtnTitle" title="Switch to English">EN</button>
    </div>
  </header>

  <main>
    <div class="viewport" id="viewport">
      <canvas id="mapCanvas"></canvas>
      <div class="crosshair" id="crosshair">
        <div class="h"></div><div class="v"></div><div class="dot"></div>
      </div>
      <div class="pin-marker" id="pinMarker"></div>
      <div class="month-nav" id="monthNav" data-i18n-aria="monthNavAria" aria-label="月份切换">
        <button type="button" id="btnPrevMonth" data-i18n-title="prevMonthTitle" title="上个月">‹ <span data-i18n="prevMonth">上月</span></button>
        <div class="month-label" id="monthLabel">—</div>
        <button type="button" id="btnNextMonth" data-i18n-title="nextMonthTitle" title="下个月"><span data-i18n="nextMonth">下月</span> ›</button>
      </div>
    </div>

    <aside class="side">
      <div class="card" id="hoverCard">
        <h2 data-i18n="hover">悬停</h2>
        <div id="hoverData" class="empty">将鼠标移到地图上</div>
      </div>
      <div class="card pinned" id="pinCard">
        <h2 data-i18n="pin">固定点</h2>
        <div id="pinData" class="empty">单击地图以固定读数</div>
      </div>
      <div class="card" id="legendCard">
        <h2 data-i18n="legend">图例</h2>
        <div id="legendBody"></div>
      </div>
      <div class="status" id="status">准备加载…</div>
    </aside>
  </main>

  function lerp(a, b, t) { return a + (b - a) * t; }
  function lerpRgb(c0, c1, t) {
    return [Math.round(lerp(c0[0], c1[0], t)), Math.round(lerp(c0[1], c1[1], t)), Math.round(lerp(c0[2], c1[2], t))];
  }
  function sampleStops(stops, t) {
    t = Math.min(1, Math.max(0, t));
    for (let i = 0; i < stops.length - 1; i++) {
      const a = stops[i], b = stops[i + 1];
      if (t >= a[0] && t <= b[0]) return lerpRgb(a[1], b[1], (t - a[0]) / (b[0] - a[0] || 1));
    }
    return stops[stops.length - 1][1];
  }

  const COLOR_STOPS = {

  function supportsColorScale(kind) {

  function windSpeedColor(t01) {
    const [r, g, b] = sampleStops(COLOR_STOPS.wind_speed, t01);
    return `rgb(${r},${g},${b})`;
  }

  function getLut(kind) {
    if (lutCache.has(kind)) return lutCache.get(kind);
    const stops = COLOR_STOPS[kind];
    const lut = new Uint8ClampedArray(256 * 4);
    for (let g = 0; g < 256; g++) {
      const t = g / 255;
      let rgb;
      if (kind === "elev_full") {
        // Hard split: ≤ sea level → light-blue family; >0 → ≥ light green
        if (t <= 0.5) rgb = sampleStops(stops, t);
        else rgb = sampleStops(stops, Math.max(t, 0.50001));
      } else {
        rgb = sampleStops(stops, t);
      }
      const [r, gv, b] = rgb;
      const i = g * 4;
      lut[i] = r; lut[i + 1] = gv; lut[i + 2] = b; lut[i + 3] = 255;
    }
    lutCache.set(kind, lut);
    return lut;
  }

  function loadImage(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.decoding = "async";
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error(`无法加载 ${url}`));
      img.src = url;
    });
  }

  async function urlExists(url) {
    try {
      const res = await fetch(url, { method: "HEAD", cache: "no-store" });
      if (res.ok) return true;
    } catch (_) { /* fall through */ }
    try {
      const res = await fetch(url, { method: "GET", cache: "no-store" });
      return res.ok;
    } catch (_) {
      return false;
    }
  }

  async function loadAssetsManifest() {

  function buildLayersFromFlags({ satellite, months, annual, pressure, pressureMonths }) {
    const layers = [];
    if (satellite) {
      layers.push({ id: "sat", name: "Satellite Color", group: "Base", src: SAT_URL, kind: "rgb" });
    }
    layers.push({ id: "elev-full", name: "Terrain — Full Elevation", group: "Terrain", src: ELEV_URL, kind: "elev_full" });
    TEMP_LAYERS = [];
    if (annual) {
      const t = TEMP_LAYER_DEFS[0];
      TEMP_LAYERS.push(t);
      layers.push({ id: t.id, name: t.name, group: "Temperature", src: t.src, kind: "temperature", monthIndex: t.monthIndex });
    }
    for (let i = 0; i < 12; i++) {
      if (!months[i]) continue;
      const t = TEMP_LAYER_DEFS[i + 1];
      TEMP_LAYERS.push(t);
      layers.push({ id: t.id, name: t.name, group: "Temperature", src: t.src, kind: "temperature", monthIndex: t.monthIndex });
    }
    if (pressure) {
      layers.push({
        id: "p-ann",
        name: "Pressure — Annual Mean",
        group: "Atmosphere",
        src: WIND_UV_ANN_URL,
        kind: "pressure",
        monthIndex: -1,
      });
    }
    const pMonths = pressureMonths || [];
    for (let i = 0; i < 12; i++) {
      if (!pMonths[i]) continue;
      const name = MONTH_NAMES[i].split(" | ")[0];
      const mm = String(i + 1).padStart(2, "0");
      layers.push({
        id: `p-${mm}`,
        name: `Pressure — ${mm} ${name}`,
        group: "Atmosphere",
        src: `../graphs/wind/Wind - UV - ${mm} ${name}.png`,
        kind: "pressure",
        monthIndex: i,
      });
    }
    LAYERS = layers;
    state.layer = LAYERS.find((l) => l.id === "t-ann") || LAYERS.find((l) => l.kind === "temperature") || LAYERS.find((l) => l.id === "elev-full") || LAYERS[0];
    state.hasSatellite = !!satellite;
    state.hasTemps = TEMP_LAYERS.length > 0;
    state.hasPressure = !!pressure;
  }

  async function resolveLayers() {
    const manifest = await loadAssetsManifest();
    if (manifest) {
      state.assets = manifest;
      const months = Array.isArray(manifest.temperature_months)
        ? manifest.temperature_months.map(Boolean)
        : Array(12).fill(false);
      buildLayersFromFlags({
        satellite: !!manifest.satellite,
        months,
        annual: !!manifest.temperature_annual,
        pressure: !!manifest.pressure_annual,
        pressureMonths: Array.isArray(manifest.pressure_months) ? manifest.pressure_months.map(Boolean) : [],
      });
      state.hasContours = !!manifest.contours;
      state.hasWindUV = !!manifest.wind_uv;
      return;
    }
    const [satellite, annual, ...monthFlags] = await Promise.all([
      urlExists(SAT_URL),
      urlExists(TEMP_LAYER_DEFS[0].src),
      ...TEMP_LAYER_DEFS.slice(1).map((t) => urlExists(t.src)),
    ]);
    const [pressure, windUV] = await Promise.all([
      urlExists(WIND_UV_ANN_URL),
      urlExists(WIND_UV_ANN_URL),
    ]);
    buildLayersFromFlags({
      satellite,
      months: monthFlags,
      annual,
      pressure,
      pressureMonths: [],
    });
    state.hasContours = await urlExists(CONTOUR_URL);
    state.hasWindUV = windUV;
  }

  function imageToGray(img) {
    return imageToChannel(img, 0);
  }

  /** Extract one RGB(A) channel as gray (0=R, 1=G, 2=B). */
  function imageToChannel(img, channel) {
    const c = document.createElement("canvas");
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.drawImage(img, 0, 0);
    const rgba = x.getImageData(0, 0, c.width, c.height).data;
    const gray = new Uint8Array(c.width * c.height);
    const off = Math.max(0, Math.min(2, channel | 0));
    for (let i = 0, j = 0; i < rgba.length; i += 4, j++) gray[j] = rgba[i + off];
    return { gray, w: c.width, h: c.height };
  }

  function buildCoastOverlay(land, w, h) {
    const edge = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let xx = 0; xx < w; xx++) {
        const i = y * w + xx;
        if (!land[i]) continue;
        const n =
          !land[y * w + ((xx - 1 + w) % w)] ||
          !land[y * w + ((xx + 1) % w)] ||
          (y > 0 && !land[i - w]) ||
          (y < h - 1 && !land[i + w]);
        if (n) edge[i] = 1;
      }
    }
    // Thicken coastline (~2px)
    const thick = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let xx = 0; xx < w; xx++) {
        const i = y * w + xx;
        if (!edge[i]) continue;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const yy = y + dy;
            if (yy < 0 || yy >= h) continue;
            const xi = (xx + dx + w) % w;
            thick[yy * w + xi] = 1;
          }
        }
      }
    }
    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    const x = c.getContext("2d");
    const img = x.createImageData(w, h);
    const d = img.data;
    const edgeColor = [150, 150, 155, 220];
    for (let i = 0; i < thick.length; i++) {
      if (!thick[i]) continue;
      const p = i * 4;
      d[p] = edgeColor[0];
      d[p + 1] = edgeColor[1];
      d[p + 2] = edgeColor[2];
      d[p + 3] = edgeColor[3];
    }
    x.putImageData(img, 0, 0);
    return c;
  }

  function buildContourOverlay(img) {
    const w = img.naturalWidth;
    const h = img.naturalHeight;
    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.drawImage(img, 0, 0);
    const src = x.getImageData(0, 0, w, h);
    const dst = x.createImageData(w, h);
    const s = src.data;
    const d = dst.data;
    // Keep bright contour / coast strokes; drop dark wash background
    for (let i = 0; i < s.length; i += 4) {
      const r = s[i], g = s[i + 1], b = s[i + 2];
      const lum = (r + g + b) / 3;
      if (lum < 125) continue;
      d[i] = Math.min(255, r + 22);
      d[i + 1] = Math.min(255, g + 16);
      d[i + 2] = Math.min(255, b + 4);
      d[i + 3] = Math.min(235, Math.round((lum - 96) * 2.3));
    }
    x.putImageData(dst, 0, 0);
    return c;
  }

  function buildDisplayImage() {
    if (!state.pixels || !state.iw) return null;
    const kind = state.layer.kind;
    const off = document.createElement("canvas");
    off.width = state.iw;
    off.height = state.ih;
    const octx = off.getContext("2d");
    const imgData = octx.createImageData(state.iw, state.ih);
    const src = state.pixels;
    const dst = imgData.data;

    if (state.useColorScale && supportsColorScale(kind)) {
      const lut = getLut(kind);
      for (let i = 0, n = src.length; i < n; i += 4) {
        const j = src[i] * 4;
        dst[i] = lut[j]; dst[i + 1] = lut[j + 1]; dst[i + 2] = lut[j + 2]; dst[i + 3] = 255;
      }
    } else {
      dst.set(src);
    }
    octx.putImageData(imgData, 0, 0);
    return off;
  }

  function fillSelect() {
    const keep = els.select.value || (state.layer && state.layer.id);
    els.select.innerHTML = "";
    const groups = [...new Set(LAYERS.map((l) => l.group))];
    for (const g of groups) {
      const og = document.createElement("optgroup");
      og.label = groupLabel(g);
      for (const layer of LAYERS.filter((l) => l.group === g)) {
        const opt = document.createElement("option");
        opt.value = layer.id;
        opt.textContent = layerDisplayName(layer);
        if (layer.id === keep) opt.selected = true;
        og.appendChild(opt);
      }
      els.select.appendChild(og);
    }
  }

  function setStatus(msg, warn = false) {
    els.status.textContent = msg;
    els.status.classList.toggle("warn", warn);
  }

  function fitView() {
    const rect = els.viewport.getBoundingClientRect();
    const pad = 24;
    state.scale = Math.min((rect.width - pad * 2) / state.iw, (rect.height - pad * 2) / state.ih);
    state.tx = (rect.width - state.iw * state.scale) / 2;
    state.ty = (rect.height - state.ih * state.scale) / 2;
  }

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = els.viewport.getBoundingClientRect();
    els.canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    els.canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    els.canvas.style.width = `${rect.width}px`;
    els.canvas.style.height = `${rect.height}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function draw() {
    const rect = els.viewport.getBoundingClientRect();
    ctx.fillStyle = "#0c1015";
    ctx.fillRect(0, 0, rect.width, rect.height);
    if (!state.img || !state.iw) return;
    ctx.imageSmoothingEnabled = state.scale < 1.5;
    ctx.imageSmoothingQuality = "high";
    const dw = state.iw * state.scale;
    const dh = state.ih * state.scale;
    // Longitude wraps: tile map copies so left/right edges meet
    const first = Math.floor((0 - state.tx) / dw) - 1;
    const last = Math.ceil((rect.width - state.tx) / dw) + 1;
    for (let k = first; k <= last; k++) {
      const x = state.tx + k * dw;
      ctx.drawImage(state.img, x, state.ty, dw, dh);
    }
    if (state.showCoast && state.coastOverlay) {
      ctx.imageSmoothingEnabled = false;
      for (let k = first; k <= last; k++) {
        ctx.drawImage(state.coastOverlay, state.tx + k * dw, state.ty, dw, dh);
      }
    }
    if (state.showContours && state.contourOverlay) {
      ctx.imageSmoothingEnabled = state.scale < 2;
      for (let k = first; k <= last; k++) {
        ctx.drawImage(state.contourOverlay, state.tx + k * dw, state.ty, dw, dh);
      }
    }
    if (state.showGraticule) {
      drawGraticule(first, last, dw, dh, rect);
    }
    if (state.showWindArrows && state.windU && state.windV && state.iw && state.ih) {
      drawWindArrows(first, last, dw, dh, rect);
    }
  }

  function drawWindArrows(first, last, dw, dh, rect) {
    // Map-anchored samples; image step chosen so on-screen spacing ≈ cell (density stable when zooming).
    const cell = 30;
    const len = 12;
    const uArr = state.windU;
    const vArr = state.windV;
    const iw = state.iw;
    const ih = state.ih;
    const scale = Math.max(state.scale, 1e-6);
    const step = Math.max(1, Math.round(cell / scale));
    let [sMin, sMax] = state.windMeta.gray_scale_speed || [0, 30];
    if (!(sMax > sMin) || sMax > 200) {
      const stride = Math.max(1, Math.floor((iw * ih) / 40000));
      const vals = [];
      for (let i = 0; i < uArr.length; i += stride) {
        const s = Math.hypot(uArr[i], vArr[i]);
        if (s > 1e-4) vals.push(s);
      }
      vals.sort((a, b) => a - b);
      if (vals.length) {
        sMin = 0;
        sMax = Math.max(vals[Math.min(vals.length - 1, Math.floor(vals.length * 0.98))], 1e-3);
        state.windMeta.gray_scale_speed = [sMin, sMax];
      } else sMax = 30;
    }
    const span = Math.max(sMax - sMin, 1e-6);

    // Visible image range (primary wrap); draw on each horizontal wrap copy
    const yMin = Math.floor((-state.ty) / scale) - step;
    const yMax = Math.ceil((rect.height - state.ty) / scale) + step;
    const xMin = Math.floor((-state.tx) / scale) - step;
    const xMax = Math.ceil((rect.width - state.tx) / scale) + step;
    const py0 = Math.max(0, Math.floor(yMin / step) * step + (step >> 1));
    const py1 = Math.min(ih, yMax);
    const px0 = Math.floor(xMin / step) * step + (step >> 1);
    const px1 = xMax;

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (let py = py0; py < py1; py += step) {
      for (let px = px0; px < px1; px += step) {
        const ix = ((Math.floor(px) % iw) + iw) % iw;
        const i = py * iw + ix;
        const u = uArr[i];
        const v = vArr[i];
        const spd = Math.hypot(u, v);
        // Hide calm cells (and near-zero encode noise); keep a floor vs legend scale
        const minSpd = 1.0;
        if (!(spd >= minSpd)) continue;
        const t01 = Math.min(1, Math.max(0, (spd - sMin) / span));
        const col = windSpeedColor(t01);
        // Stored: +U east, +V south (image). Canvas y also increases south.
        const ang = Math.atan2(v, u);
        const ca = Math.cos(ang);
        const sa = Math.sin(ang);
        for (let k = first; k <= last; k++) {
          const sx = state.tx + k * dw + px * scale;
          const sy = state.ty + py * scale;
          if (sx < -16 || sx > rect.width + 16 || sy < -16 || sy > rect.height + 16) continue;
          const x1 = sx - ca * len * 0.35;
          const y1 = sy - sa * len * 0.35;
          const x2 = sx + ca * len * 0.65;
          const y2 = sy + sa * len * 0.65;
          // dark halo for contrast on any basemap
          ctx.strokeStyle = "rgba(0,0,0,0.55)";
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x2 - Math.cos(ang + 0.7) * len * 0.42, y2 - Math.sin(ang + 0.7) * len * 0.42);
          ctx.lineTo(x2, y2);
          ctx.lineTo(x2 - Math.cos(ang - 0.7) * len * 0.42, y2 - Math.sin(ang - 0.7) * len * 0.42);
          ctx.stroke();
          ctx.strokeStyle = col;
          ctx.lineWidth = 1.35;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x2 - Math.cos(ang + 0.7) * len * 0.42, y2 - Math.sin(ang + 0.7) * len * 0.42);
          ctx.lineTo(x2, y2);
          ctx.lineTo(x2 - Math.cos(ang - 0.7) * len * 0.42, y2 - Math.sin(ang - 0.7) * len * 0.42);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  /** Image y for latitude (equirectangular, +90 at top). */
  function latToY(lat) {
    return ((90 - lat) / 180) * state.ih;
  }
  /** Image x for longitude (−180…180). */
  function lonToX(lon) {
    return ((lon + 180) / 360) * state.iw;
  }

  function drawGraticule(first, last, dw, dh, rect) {
    const OBL = 23.5;
    const specialLats = [
      { lat: 0, kind: "equator" },
      { lat: OBL, kind: "tropic" },
      { lat: -OBL, kind: "tropic" },
      { lat: 90 - OBL, kind: "polar" },
      { lat: -(90 - OBL), kind: "polar" },
    ];
    const specialSet = new Set(specialLats.map((s) => s.lat));

    ctx.save();
    ctx.lineCap = "butt";

    // Regular parallels every 30° (skip specials; drawn thicker later)
    ctx.strokeStyle = "rgba(220, 230, 240, 0.28)";
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    for (let lat = -60; lat <= 60; lat += 30) {
      if (specialSet.has(lat)) continue;
      const iy = latToY(lat);
      const sy = state.ty + iy * state.scale;
      if (sy < -2 || sy > rect.height + 2) continue;
      ctx.beginPath();
      ctx.moveTo(0, sy);
      ctx.lineTo(rect.width, sy);
      ctx.stroke();
    }

    // Regular meridians every 30° (prime meridian drawn thicker below)
    for (let lon = -180; lon < 180; lon += 30) {
      if (lon === 0) continue;
      const ix = lonToX(lon);
      for (let k = first; k <= last; k++) {
        const sx = state.tx + k * dw + ix * state.scale;
        if (sx < -2 || sx > rect.width + 2) continue;
        ctx.beginPath();
        ctx.moveTo(sx, state.ty);
        ctx.lineTo(sx, state.ty + dh);
        ctx.stroke();
      }
    }

    // Special parallels: equator / tropics / polar circles (thicker)
    for (const { lat, kind } of specialLats) {
      const iy = latToY(lat);
      const sy = state.ty + iy * state.scale;
      if (sy < -4 || sy > rect.height + 4) continue;
      if (kind === "equator") {
        ctx.strokeStyle = "rgba(255, 220, 120, 0.85)";
        ctx.lineWidth = 2.6;
        ctx.setLineDash([]);
      } else if (kind === "tropic") {
        ctx.strokeStyle = "rgba(255, 170, 90, 0.75)";
        ctx.lineWidth = 2.1;
        ctx.setLineDash([7, 5]);
      } else {
        ctx.strokeStyle = "rgba(160, 210, 255, 0.8)";
        ctx.lineWidth = 2.1;
        ctx.setLineDash([5, 5]);
      }
      ctx.beginPath();
      ctx.moveTo(0, sy);
      ctx.lineTo(rect.width, sy);
      ctx.stroke();
    }

    // Prime meridian slightly emphasized
    {
      const ix = lonToX(0);
      ctx.strokeStyle = "rgba(255, 220, 120, 0.55)";
      ctx.lineWidth = 1.8;
      ctx.setLineDash([]);
      for (let k = first; k <= last; k++) {
        const sx = state.tx + k * dw + ix * state.scale;
        if (sx < -2 || sx > rect.width + 2) continue;
        ctx.beginPath();
        ctx.moveTo(sx, state.ty);
        ctx.lineTo(sx, state.ty + dh);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function wrapX(x) {
    const w = state.iw;
    if (!w) return x;
    return ((x % w) + w) % w;
  }

  function screenToImageRaw(clientX, clientY) {
    const rect = els.viewport.getBoundingClientRect();
    return {
      x: (clientX - rect.left - state.tx) / state.scale,
      y: (clientY - rect.top - state.ty) / state.scale,
    };
  }

  function screenToImage(clientX, clientY) {
    const raw = screenToImageRaw(clientX, clientY);
    return { x: wrapX(raw.x), y: raw.y };
  }

  function imageToScreen(ix, iy) {
    const rect = els.viewport.getBoundingClientRect();
    const dw = state.iw * state.scale;
    const baseX = state.tx + ix * state.scale;
    const y = state.ty + iy * state.scale;
    if (!dw) return { x: baseX, y };
    let best = baseX;
    let bestScore = Infinity;
    const first = Math.floor((0 - baseX) / dw) - 1;
    const last = Math.ceil((rect.width - baseX) / dw) + 1;
    for (let k = first; k <= last; k++) {
      const x = baseX + k * dw;
      if (x < -40 || x > rect.width + 40) continue;
      const score = Math.abs(x - rect.width * 0.5);
      if (score < bestScore) {
        bestScore = score;
        best = x;
      }
    }
    return { x: best, y };
  }

  function clampPixel(ix, iy) {
    if (!state.iw || !state.ih) return null;
    const y = Math.floor(iy);
    if (y < 0 || y >= state.ih) return null;
    const x = Math.floor(wrapX(ix));
    return { x, y };
  }

  function grayToRGBA(gray) {
    const rgba = new Uint8ClampedArray(gray.length * 4);
    for (let i = 0, j = 0; i < gray.length; i++, j += 4) {
      const g = gray[i];
      rgba[j] = g;
      rgba[j + 1] = g;
      rgba[j + 2] = g;
      rgba[j + 3] = 255;
    }
    return rgba;
  }

  function isMonthlyNavLayer(layer) {
    return (
      (layer.kind === "temperature" || layer.kind === "pressure") &&
      typeof layer.monthIndex === "number" &&
      layer.monthIndex >= 0
    );
  }

  function isMonthlyTemp(layer) {
    return layer.kind === "temperature" && typeof layer.monthIndex === "number" && layer.monthIndex >= 0;
  }

  function updateMonthNav() {
    const show = isMonthlyNavLayer(state.layer);
    els.monthNav.classList.toggle("show", show);
    if (show) {
      els.monthLabel.textContent = monthLabel(state.layer.monthIndex);
      els.select.value = state.layer.id;
      const kindLabel = state.layer.kind === "pressure" ? t("kindPres") : t("kindTemp");
      els.btnPrevMonth.title = t("prevKind", { kind: kindLabel });
      els.btnNextMonth.title = t("nextKind", { kind: kindLabel });
    }
  }

  async function shiftMonth(delta) {
    if (!isMonthlyNavLayer(state.layer)) return;
    const kind = state.layer.kind;
    const monthly = LAYERS.filter(
      (l) => l.kind === kind && typeof l.monthIndex === "number" && l.monthIndex >= 0
    ).sort((a, b) => a.monthIndex - b.monthIndex);
    if (!monthly.length) return;
    const idx = monthly.findIndex((l) => l.id === state.layer.id);
    if (idx < 0) return;
    const layer = monthly[(idx + delta + monthly.length) % monthly.length];
    els.select.value = layer.id;
    await loadLayer(layer, { keepView: true });
  }

  function grayAt(arr, px, py) {
    if (!arr) return null;
    return arr[py * state.iw + px];
  }

  function tempFromGray(g) {
    const [tMin, tMax] = state.tempMeta.gray_scale_C;
    return tMin + (g / 255) * (tMax - tMin);
  }

  function elevFromGray(g, _isLand) {
    // README: >0.5 → 0…max_elev_m; <0.5 → 0…min_elev_m (default ±8000), both linear in gray.
    const maxElev = state.tempMeta.max_elev_m || 8000;
    const minElev = state.tempMeta.min_elev_m != null ? state.tempMeta.min_elev_m : -maxElev;
    const v01 = g / 255;
    if (v01 >= 0.5) {
      return Math.max(0, ((v01 - 0.5) / 0.5) * maxElev);
    }
    const t = Math.max(0, (0.5 - v01) / 0.5);
    return t * minElev; // minElev ≤ 0
  }

  function pressureFromGray(g) {
    const [pMin, pMax] = state.windMeta.gray_scale_pressure_hpa || [980, 1040];
    return pMin + (g / 255) * (pMax - pMin);
  }

  /** Wind TOWARD deg: 0°=N, 90°=E. Stored V is image/+south → north = −V. */
  function windTowardDeg(u, v) {
    return (((Math.atan2(u, -v) * 180) / Math.PI) + 360) % 360;
  }

  function formatWindReadout(speed, u, v) {
    if (speed == null || u == null || v == null) return "—";
    if (!(speed > 1e-6)) return "0 · —";
    return `${Math.round(speed)} · ${Math.round(windTowardDeg(u, v))}°`;
  }

  function legendFor(kind) {
    const [tMin, tMax] = state.tempMeta.gray_scale_C;
    const maxElev = state.tempMeta.max_elev_m || 8000;
    const minElev = state.tempMeta.min_elev_m != null ? state.tempMeta.min_elev_m : -maxElev;
    if (kind === "temperature") {
      return {
        title: t("legendTemp"),
        gradient: LEGEND_CSS.temperature,
        left: `${tMin} °C`,
        right: `${tMax} °C`,
        note: t("legendTempNote"),
      };
    }
    if (kind === "elev_full") {
      return {
        title: t("legendElev"),
        gradient: state.useColorScale ? LEGEND_CSS.elev_full : "linear-gradient(90deg,#050505,#808080 50%,#fff)",
        left: t("legendDeep", { m: minElev }),
        right: t("legendPeak", { m: maxElev }),
        note: t("legendElevNote"),
      };
    }
    if (kind === "pressure") {
      const [pMin, pMax] = state.windMeta.gray_scale_pressure_hpa || [980, 1040];
      return {
        title: t("legendPres"),
        gradient: LEGEND_CSS.pressure,
        left: `${pMin.toFixed(0)} hPa`,
        right: `${pMax.toFixed(0)} hPa`,
        note: t("legendPresNote"),
      };
    }
    return {
      title: t("legendRgb"),
      gradient: LEGEND_CSS.rgb,
      left: t("legendDark"),
      right: t("legendBright"),
      note: t("legendRgbNote"),
    };
  }

  function displayColor(rgba) {
    if (state.useColorScale && supportsColorScale(state.layer.kind)) {
      const lut = getLut(state.layer.kind);
      const j = rgba.r * 4;
      return { r: lut[j], g: lut[j + 1], b: lut[j + 2] };
    }
    return { r: rgba.r, g: rgba.g, b: rgba.b };
  }

  function formatReadout(sample, withChart = false) {
    if (!sample) return `<div class="empty">${t("hoverOob")}</div>`;
    const { lat, lon } = sample.ll;
    const sw = displayColor(sample.rgba);
    const swatch = `rgb(${sw.r},${sw.g},${sw.b})`;
    const freezeC = state.tempMeta.freeze_C ?? 0;
    const kTemp = t("temp");
    const kType = t("type");
    const kPres = t("pressure");
    const kWind = t("windToward");
    const rows = [
      [t("lat"), `${lat.toFixed(4)}°`],
      [t("lon"), `${lon.toFixed(4)}°`],
      [kType, sample.isLand ? t("land") : t("ocean")],
      [t("elev"), sample.isLand ? `+${sample.elevM.toFixed(0)} m` : `−${Math.abs(sample.elevM).toFixed(0)} m`],
      [kTemp, sample.tC == null ? "—" : `${sample.tC.toFixed(2)} °C`],
      [t("frozen"), sample.tC == null ? "—" : (sample.tC <= freezeC ? t("yes") : t("no"))],
      [kPres, sample.pressureHpa == null ? "—" : `${Math.round(sample.pressureHpa)} hPa`],
      [kWind, formatWindReadout(sample.windSpeed, sample.windU, sample.windV)],
      [t("color"), `<span class="swatch" style="background:${swatch}"></span>${swatch}`],
    ];
    const html = rows
      .map(([k, v]) => {
        const emph = k === kTemp || k === kType || k === kPres || k === kWind;
        return `<div class="k">${k}</div><div class="v${emph ? " emph" : ""}">${v}</div>`;
      })
      .join("");

    let chart = "";
    if (withChart) {
      const meanTxt = sample.tMean == null ? "—" : `${sample.tMean.toFixed(1)} °C`;
      chart = `
        <div class="temp-chart-wrap">
          <div class="chart-title">${t("chartTitle", { mean: meanTxt })}</div>
          <canvas id="pinChart" width="300" height="120"></canvas>
          <div class="chart-tooltip" id="chartTooltip"></div>
        </div>`;
    }
    return `<div class="kv">${html}</div>${chart}`;
  }

  function syncChartAxisFromMeta() {
    const [tMin, tMax] = state.tempMeta.gray_scale_C;
    // Nice global step shared by all pin charts
    const span = tMax - tMin;
    let step = 15;
    if (span <= 60) step = 10;
    if (span <= 40) step = 5;
    if (span > 120) step = 20;
    state.chartY = { min: tMin, max: tMax, step };
  }

  function placeChartTooltip(tip, clientX, clientY) {
    tip.classList.add("show");
    // Measure after content is set
    const pad = 8;
    const tw = tip.offsetWidth || 120;
    const th = tip.offsetHeight || 28;
    let left = clientX + 14;
    let top = clientY - th - 10;
    if (left + tw > window.innerWidth - pad) left = clientX - tw - 14;
    if (left < pad) left = pad;
    if (top < pad) top = clientY + 14;
    if (top + th > window.innerHeight - pad) {
      top = Math.max(pad, window.innerHeight - th - pad);
    }
    tip.style.left = `${left}px`;
    tip.style.top = `${top}px`;
  }

  function drawPinChart(monthly, tMean) {
    const canvas = document.getElementById("pinChart");
    const tip = document.getElementById("chartTooltip");
    if (!canvas || !monthly) return;
    const c = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    const pad = { l: 32, r: 8, t: 10, b: 22 };
    c.clearRect(0, 0, W, H);
    c.fillStyle = "#12161c";
    c.fillRect(0, 0, W, H);

    const vals = monthly.filter((v) => v != null);
    if (!vals.length) return;
    const mean = tMean != null ? tMean : vals.reduce((a, b) => a + b, 0) / vals.length;

    // Global axis — identical for every pin
    const ymin = state.chartY.min;
    const ymax = state.chartY.max;
    const yStep = state.chartY.step;
    const ySpan = ymax - ymin || 1;

    const xAt = (i) => pad.l + (i / 11) * (W - pad.l - pad.r);
    const yAt = (v) => pad.t + (1 - (v - ymin) / ySpan) * (H - pad.t - pad.b);

    c.strokeStyle = "#2a3544";
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(pad.l, pad.t);
    c.lineTo(pad.l, H - pad.b);
    c.lineTo(W - pad.r, H - pad.b);
    c.stroke();

    // Horizontal grid + labels at global step
    c.font = "10px IBM Plex Mono, monospace";
    c.textAlign = "right";
    c.textBaseline = "middle";
    const tick0 = Math.ceil(ymin / yStep) * yStep;
    for (let t = tick0; t <= ymax + 1e-6; t += yStep) {
      const y = yAt(t);
      c.strokeStyle = "rgba(42,53,68,0.85)";
      c.beginPath();
      c.moveTo(pad.l, y);
      c.lineTo(W - pad.r, y);
      c.stroke();
      c.fillStyle = "#8b9aab";
      c.fillText(`${Math.round(t)}`, pad.l - 4, y);
    }

    c.textAlign = "center";
    c.textBaseline = "alphabetic";
    c.fillStyle = "#8b9aab";
    for (let i = 0; i < 12; i += 2) c.fillText(String(i + 1), xAt(i), H - 6);

    const yMean = yAt(mean);
    c.strokeStyle = "rgba(212,165,116,0.9)";
    c.lineWidth = 1.25;
    c.setLineDash([4, 4]);
    c.beginPath();
    c.moveTo(pad.l, yMean);
    c.lineTo(W - pad.r, yMean);
    c.stroke();
    c.setLineDash([]);

    c.strokeStyle = "#e07a5f";
    c.lineWidth = 1.75;
    c.beginPath();
    let started = false;
    for (let i = 0; i < 12; i++) {
      if (monthly[i] == null) continue;
      const x = xAt(i);
      const y = yAt(monthly[i]);
      if (!started) {
        c.moveTo(x, y);
        started = true;
      } else c.lineTo(x, y);
    }
    c.stroke();

    const activeMonth =
      isMonthlyTemp(state.layer) ? state.layer.monthIndex : -1;
    state.chartPoints = [];
    for (let i = 0; i < 12; i++) {
      if (monthly[i] == null) continue;
      const x = xAt(i);
      const y = yAt(monthly[i]);
      state.chartPoints.push({ i, x, y, t: monthly[i] });
      const active = i === activeMonth;
      c.beginPath();
      c.arc(x, y, active ? 4.2 : 2.6, 0, Math.PI * 2);
      c.fillStyle = active ? "#f0c090" : "#e07a5f";
      c.fill();
      if (active) {
        c.strokeStyle = "#fff";
        c.lineWidth = 1;
        c.stroke();
      }
    }

    if (tip) {
      tip.classList.remove("show");
      canvas.onmousemove = (ev) => {
        const rect = canvas.getBoundingClientRect();
        const sx = ((ev.clientX - rect.left) / rect.width) * W;
        const sy = ((ev.clientY - rect.top) / rect.height) * H;
        let best = null;
        let bestD = 14;
        for (const p of state.chartPoints) {
          const d = Math.hypot(p.x - sx, p.y - sy);
          if (d < bestD) {
            bestD = d;
            best = p;
          }
        }
        if (!best) {
          tip.classList.remove("show");
          return;
        }
        tip.textContent = `${monthLabel(best.i)}: ${best.t.toFixed(2)} °C`;
        placeChartTooltip(tip, ev.clientX, ev.clientY);
      };
      canvas.onmouseleave = () => tip.classList.remove("show");
    }
  }

  function readAt(ix, iy) {
    const p = clampPixel(ix, iy);
    if (!p || !state.pixels) return null;
    const i = (p.y * state.iw + p.x) * 4;
    const d = state.pixels;
    const rgba = { r: d[i], g: d[i + 1], b: d[i + 2], a: d[i + 3] };
    const lon = (p.x + 0.5) * (360 / state.iw) - 180;
    const lat = 90 - (p.y + 0.5) * (180 / state.ih);

    const isLand = state.land ? state.land[p.y * state.iw + p.x] === 1 : rgba.r > 127;
    const elevG = state.elevGray ? grayAt(state.elevGray, p.x, p.y) : null;
    const elevM = elevG == null ? 0 : elevFromGray(elevG, isLand);

    const monthly = [];
    for (let m = 0; m < 12; m++) {
      const g = state.tempMonths[m] ? grayAt(state.tempMonths[m], p.x, p.y) : null;
      monthly.push(g == null ? null : tempFromGray(g));
    }
    const present = monthly.filter((v) => v != null);
    const tMean = present.length
      ? present.reduce((a, b) => a + b, 0) / present.length
      : null;

    // Temperature shown = same source as map layer (and chart point for that month)
    let tC = null;
    const mi = state.layer.monthIndex;
    if (state.layer.kind === "temperature" && typeof mi === "number" && mi >= 0) {
      tC = monthly[mi];
    } else if (state.layer.kind === "temperature" && mi === -1) {
      // Annual layer: decode the same gray the map displays
      tC = tempFromGray(rgba.r);
    } else if (tMean != null) {
      tC = tMean;
    }

    const tAnnG = state.tempAnnual ? grayAt(state.tempAnnual, p.x, p.y) : null;
    const tAnnual = tAnnG == null ? null : tempFromGray(tAnnG);

    let pressureHpa = null;
    let windSpeed = null;
    let windU = null;
    let windV = null;
    if (state.layer.kind === "pressure") {
      pressureHpa = pressureFromGray(rgba.r);
    } else {
      const pMi = typeof mi === "number" && mi >= 0 ? mi : -1;
      let pg = null;
      if (pMi >= 0 && state.pressureMonths[pMi]) pg = grayAt(state.pressureMonths[pMi], p.x, p.y);
      else if (state.pressureAnnual) pg = grayAt(state.pressureAnnual, p.x, p.y);
      if (pg != null) pressureHpa = pressureFromGray(pg);
    }
    const idx = p.y * state.iw + p.x;
    if (state.windU && state.windV) {
      windU = state.windU[idx];
      windV = state.windV[idx];
      windSpeed = Math.hypot(windU, windV);
    }

    return {
      px: p.x,
      py: p.y,
      rgba,
      ll: { lat, lon },
      isLand,
      elevM,
      tC,
      tAnnual,
      tMean,
      monthly,
      pressureHpa,
      windSpeed,
      windU,
      windV,
    };
  }

  function updateLegend() {
    const L = legendFor(state.layer.kind);
    let html = `
      <div style="font-family:var(--font-data);font-size:0.78rem;margin-bottom:0.25rem">${L.title}</div>
      <div class="legend-bar" style="background:${L.gradient}"></div>
      <div class="legend-labels"><span>${L.left}</span><span>${L.right}</span></div>
      <div class="legend-note">${L.note}</div>
    `;
    if (state.showWindArrows && state.hasWindUV) {
      const [sMin, sMax] = state.windMeta.gray_scale_speed || [0, 30];
      html += `
        <div style="font-family:var(--font-data);font-size:0.78rem;margin:0.75rem 0 0.25rem">${t("legendSpeed")}</div>
        <div class="legend-bar" style="background:${LEGEND_CSS.wind_speed}"></div>
        <div class="legend-labels"><span>${sMin.toFixed(1)}</span><span>${sMax.toFixed(1)}</span></div>
        <div class="legend-note">${t("legendSpeedNote")}</div>
      `;
    }
    els.legendBody.innerHTML = html;
  }

  function updateHoverUI(sample, clientX, clientY) {
    state.hover = sample;
    if (!sample) {
      els.crosshair.classList.remove("on");
      els.hoverData.innerHTML = `<div class="empty">${t("hoverOob")}</div>`;
      return;
    }
    const rect = els.viewport.getBoundingClientRect();
    const sx = clientX - rect.left;
    const sy = clientY - rect.top;
    els.crosshair.classList.add("on");
    els.crosshair.querySelector(".h").style.top = `${sy}px`;
    els.crosshair.querySelector(".v").style.left = `${sx}px`;
    const dot = els.crosshair.querySelector(".dot");
    dot.style.left = `${sx}px`;
    dot.style.top = `${sy}px`;
    els.hoverData.innerHTML = formatReadout(sample, false);
  }

  function updatePinUI() {
    if (!state.pin) {
      els.pinMarker.classList.remove("on");
      els.pinData.innerHTML = `<div class="empty">${t("pinHint")}</div>`;
      return;
    }
    const sample = readAt(state.pin.px + 0.5, state.pin.py + 0.5);
    if (sample) state.pin = sample;
    const s = imageToScreen(state.pin.px + 0.5, state.pin.py + 0.5);
    els.pinMarker.style.left = `${s.x}px`;
    els.pinMarker.style.top = `${s.y}px`;
    els.pinMarker.classList.add("on");
    els.pinData.innerHTML = formatReadout(state.pin, true);
    requestAnimationFrame(() => drawPinChart(state.pin.monthly, state.pin.tMean));
  }

  async function loadLayer(layer, { keepView = false } = {}) {
    state.layer = layer;
    setStatus(t("loadLayer", { name: layerDisplayName(layer) }));
    els.hoverData.innerHTML = `<div class="empty">${t("loading")}</div>`;

    let usedCache = false;
    if (layer.kind === "temperature" && state.dataReady) {
      const gray =
        layer.monthIndex >= 0 ? state.tempMonths[layer.monthIndex] : state.tempAnnual;
      if (gray) {
        state.pixels = grayToRGBA(gray);
        usedCache = true;
      }
    }
    if (layer.kind === "pressure" && state.dataReady) {
      const gray =
        layer.monthIndex >= 0 ? state.pressureMonths[layer.monthIndex] : state.pressureAnnual;
      if (gray) {
        state.pixels = grayToRGBA(gray);
        usedCache = true;
      }
    }

    if (!usedCache) {
      const img = await loadImage(layer.src);
      state.iw = img.naturalWidth;
      state.ih = img.naturalHeight;
      if (layer.kind === "pressure") {
        const { gray } = imageToChannel(img, 2);
        state.pixels = grayToRGBA(gray);
      } else {
        const off = document.createElement("canvas");
        off.width = state.iw;
        off.height = state.ih;
        const octx = off.getContext("2d", { willReadFrequently: true });
        octx.drawImage(img, 0, 0);
        state.pixels = octx.getImageData(0, 0, state.iw, state.ih).data;
      }
    }

    state.img = buildDisplayImage();
    if (!keepView) fitView();
    await syncWindOverlayForLayer(layer);
    draw();
    updateLegend();
    updateMonthNav();
    updatePinUI();
    const notes = [];
    if (state.useColorScale && supportsColorScale(layer.kind)) notes.push(t("noteColor"));
    if (state.showCoast) notes.push(t("noteCoast"));
    if (state.showContours) notes.push(t("noteContours"));
    if (state.showGraticule) notes.push(t("noteGraticule"));
    if (state.showWindArrows) notes.push(t("noteWind"));
    setStatus(`${layerDisplayName(layer)} · ${state.iw}×${state.ih}${notes.length ? " · " + notes.join(" · ") : ""}`);
  }

  function refreshDisplay() {
    if (!state.pixels) return;
    state.img = buildDisplayImage();
    draw();
    updateLegend();
    updateMonthNav();
    updatePinUI();
  }

  async function loadGlobalData() {
    setStatus(t("loadElev"));
    const elevImg = await loadImage(ELEV_URL);
    let landImg = null;
    try {
      landImg = await loadImage(LAND_MASK_URL);
    } catch (_) {
      landImg = null;
    }
    const { gray: elevGray, w, h } = imageToGray(elevImg);
    state.iw = w;
    state.ih = h;
    state.elevGray = elevGray;
    state.land = new Uint8Array(w * h);
    if (landImg && landImg.naturalWidth === w && landImg.naturalHeight === h) {
      const { gray: landGray } = imageToGray(landImg);
      for (let i = 0; i < landGray.length; i++) state.land[i] = landGray[i] > 127 ? 1 : 0;
    } else {
      // Derive land from full elevation (0.5 = sea level) if mask missing
      for (let i = 0; i < elevGray.length; i++) state.land[i] = elevGray[i] > 127 ? 1 : 0;
      setStatus(t("noMask"), true);
    }
    state.coastOverlay = buildCoastOverlay(state.land, w, h);

    if (state.hasContours !== false) {
      setStatus(t("loadContours"));
      try {
        const contourImg = await loadImage(CONTOUR_URL);
        state.contourOverlay = buildContourOverlay(contourImg);
        state.hasContours = true;
      } catch (_) {
        state.contourOverlay = null;
        state.hasContours = false;
      }
    }

    state.tempAnnual = null;
    state.tempMonths = Array(12).fill(null);
    if (TEMP_LAYERS.length) {
      setStatus(t("loadTemps"));
      for (const t of TEMP_LAYERS) {
        try {
          const img = await loadImage(t.src);
          const { gray } = imageToGray(img);
          if (t.monthIndex < 0) state.tempAnnual = gray;
          else state.tempMonths[t.monthIndex] = gray;
        } catch (_) {
          /* skip missing month */
        }
      }
    }

    state.pressureAnnual = null;
    state.pressureMonths = Array(12).fill(null);
    const pressureLayers = LAYERS.filter((l) => l.kind === "pressure");
    if (pressureLayers.length) {
      setStatus(t("loadPressure"));
      for (const pl of pressureLayers) {
        try {
          const img = await loadImage(pl.src);
          // Pressure is B channel of Wind-UV RGB (U→R V→G P→B)
          const { gray } = imageToChannel(img, 2);
          if (pl.monthIndex < 0) state.pressureAnnual = gray;
          else if (typeof pl.monthIndex === "number") state.pressureMonths[pl.monthIndex] = gray;
        } catch (_) {
          /* skip missing */
        }
      }
    }
    state.dataReady = true;
  }

  function decodeU16Pair(hi, lo, vmin, vmax) {
    const q = (hi << 8) | lo;
    return vmin + (q / 65535) * (vmax - vmin);
  }

  async function loadWindUV(monthIndex = -1) {
    const key = monthIndex >= 0 ? `m${monthIndex}` : "ann";
    if (state.windUvKey === key && state.windU && state.windV) return;

    if (state.windUvCache.has(key)) {
      const hit = state.windUvCache.get(key);
      state.windU = hit.u;
      state.windV = hit.v;
      state.windMeta.gray_scale_speed = hit.speedScale.slice();
      if (hit.pressureScale) state.windMeta.gray_scale_pressure_hpa = hit.pressureScale.slice();
      state.windUvKey = key;
      state.hasWindUV = true;
      return;
    }

    let url = WIND_UV_ANN_URL;
    let speedScale = state.windMeta.gray_scale_speed || [0, 30];
    let pressureScale = state.windMeta.gray_scale_pressure_hpa || [980, 1040];
    let uRange = [-40, 40];
    let vRange = [-40, 40];
    try {
      if (!state.windMetaFull) {
        const resMeta = await fetch(WIND_META_URL, { cache: "no-store" });
        if (resMeta.ok) state.windMetaFull = await resMeta.json();
      }
      const wm = state.windMetaFull;
      const block =
        monthIndex >= 0 && Array.isArray(wm?.months) && wm.months[monthIndex]
          ? wm.months[monthIndex]
          : wm?.annual;
      if (block) {
        if (block.gray_scale_pressure_hpa) pressureScale = block.gray_scale_pressure_hpa;
        if (block.gray_scale_speed) speedScale = block.gray_scale_speed;
        if (block.uv_scale?.u) uRange = block.uv_scale.u;
        if (block.uv_scale?.v) vRange = block.uv_scale.v;
        if (block.files?.uv) url = `../graphs/wind/${block.files.uv}`;
      }
    } catch (_) { /* defaults */ }

    let img;
    try {
      img = await loadImage(url);
    } catch (_) {
      if (monthIndex >= 0) {
        await loadWindUV(-1);
        return;
      }
      throw new Error(`无法加载风场 UV: ${url}`);
    }
    if (img.naturalWidth !== state.iw || img.naturalHeight !== state.ih) {
      throw new Error(`风场 UV 尺寸 ${img.naturalWidth}×${img.naturalHeight} ≠ ${state.iw}×${state.ih}`);
    }
    const c = document.createElement("canvas");
    c.width = state.iw;
    c.height = state.ih;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.drawImage(img, 0, 0);
    const rgba = x.getImageData(0, 0, state.iw, state.ih).data;
    const n = state.iw * state.ih;
    const u = new Float32Array(n);
    const v = new Float32Array(n);
    const [uMin, uMax] = uRange;
    const [vMin, vMax] = vRange;
    // RGB8: U→R, V→G, pressure→B
    for (let i = 0, j = 0; i < n; i++, j += 4) {
      u[i] = uMin + (rgba[j] / 255) * (uMax - uMin);
      v[i] = vMin + (rgba[j + 1] / 255) * (vMax - vMin);
    }
    let sMax = speedScale[1];
    if (!(sMax > 0) || sMax > 200) {
      const stride = Math.max(1, Math.floor(n / 40000));
      const vals = [];
      for (let i = 0; i < n; i += stride) {
        const s = Math.hypot(u[i], v[i]);
        if (s > 1e-4) vals.push(s);
      }
      vals.sort((a, b) => a - b);
      sMax = vals.length
        ? Math.max(vals[Math.min(vals.length - 1, Math.floor(vals.length * 0.98))], 1e-3)
        : 30;
      speedScale = [0, sMax];
    }
    state.windUvCache.set(key, {
      u,
      v,
      speedScale: speedScale.slice(),
      pressureScale: pressureScale.slice(),
    });
    state.windU = u;
    state.windV = v;
    state.windMeta.gray_scale_speed = speedScale.slice();
    state.windMeta.gray_scale_pressure_hpa = pressureScale.slice();
    state.windUvKey = key;
    state.hasWindUV = true;
  }

  function windMonthIndexForLayer(layer) {
    if (!layer) return -1;
    if (typeof layer.monthIndex === "number" && layer.monthIndex >= 0) return layer.monthIndex;
    return -1;
  }

  async function syncWindOverlayForLayer(layer) {
    if (!state.hasWindUV && !state.showWindArrows) return;
    const mi = windMonthIndexForLayer(layer);
    try {
      await loadWindUV(mi);
      updateLegend();
    } catch (e) {
      setStatus(String(e.message || e), true);
    }
  }

  // --- events ---
  document.getElementById("btnLang").addEventListener("click", () => {
    setUiLang(uiLang === "en" ? "zh" : "en");
  });

  els.select.addEventListener("change", () => {
    const layer = LAYERS.find((l) => l.id === els.select.value);
    if (layer) loadLayer(layer).catch((e) => setStatus(String(e.message || e), true));
  });

  els.monthNav.addEventListener("click", (e) => e.stopPropagation());
  els.monthNav.addEventListener("pointerdown", (e) => e.stopPropagation());
  els.btnPrevMonth.addEventListener("click", (e) => {
    e.stopPropagation();
    shiftMonth(-1).catch((err) => setStatus(String(err.message || err), true));
  });
  els.btnNextMonth.addEventListener("click", (e) => {
    e.stopPropagation();
    shiftMonth(1).catch((err) => setStatus(String(err.message || err), true));
  });

  els.colorScaleToggle.addEventListener("change", () => {
    state.useColorScale = els.colorScaleToggle.checked;
    refreshDisplay();
  });

  els.graticuleToggle.addEventListener("change", () => {
    state.showGraticule = els.graticuleToggle.checked;
    draw();
  });

  els.coastToggle.addEventListener("change", () => {
    state.showCoast = els.coastToggle.checked;
    draw();
  });

  els.contourToggle.addEventListener("change", () => {
    state.showContours = els.contourToggle.checked;
    draw();
  });

  els.windArrowToggle.addEventListener("change", () => {
    state.showWindArrows = els.windArrowToggle.checked;
    updateLegend();
    if (state.showWindArrows) {
      syncWindOverlayForLayer(state.layer)
        .then(() => draw())
        .catch((e) => setStatus(String(e.message || e), true));
    } else {
      draw();
    }
  });

  els.btnReset.addEventListener("click", () => {
    fitView();
    draw();
    updatePinUI();
  });

  els.btnClearPin.addEventListener("click", () => {
    state.pin = null;
    updatePinUI();
  });

  els.viewport.addEventListener("click", (e) => {
    if (e.button !== 0) return;
    if (state.didPan) { state.didPan = false; return; }
    const { x, y } = screenToImage(e.clientX, e.clientY);
    const sample = readAt(x, y);
    if (!sample) return;
    state.pin = sample;
    updatePinUI();
  });

  function beginPan(e) {
    state.panning = true;
    state.didPan = false;
    els.viewport.classList.add("panning");
    state.panOrigin = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty };
    els.viewport.setPointerCapture(e.pointerId);
  }

  els.viewport.addEventListener("pointerdown", (e) => {
    if (e.button === 1 || e.button === 2 || (e.button === 0 && e.shiftKey)) {
      e.preventDefault();
      beginPan(e);
    }
  });

  els.viewport.addEventListener("pointermove", (e) => {
    if (state.panning && state.panOrigin) {
      const dx = e.clientX - state.panOrigin.x;
      const dy = e.clientY - state.panOrigin.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) state.didPan = true;
      state.tx = state.panOrigin.tx + dx;
      state.ty = state.panOrigin.ty + dy;
      draw();
      updatePinUI();
      return;
    }
    const { x, y } = screenToImage(e.clientX, e.clientY);
    updateHoverUI(readAt(x, y), e.clientX, e.clientY);
  });

  els.viewport.addEventListener("pointerup", () => {
    if (state.panning) {
      state.panning = false;
      els.viewport.classList.remove("panning");
      state.panOrigin = null;
    }
  });

  els.viewport.addEventListener("pointerleave", () => {
    if (state.panning) return;
    state.hover = null;
    els.crosshair.classList.remove("on");
    els.hoverData.innerHTML = `<div class="empty">${t("hoverMove")}</div>`;
  });

  els.viewport.addEventListener("contextmenu", (e) => e.preventDefault());

  els.viewport.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (!state.img) return;
    const rect = els.viewport.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const before = screenToImageRaw(e.clientX, e.clientY);
    state.scale = Math.min(64, Math.max(0.05, state.scale * Math.exp(-e.deltaY * 0.0015)));
    state.tx = mx - before.x * state.scale;
    state.ty = my - before.y * state.scale;
    draw();
    updatePinUI();
    updateHoverUI(readAt(wrapX(before.x), before.y), e.clientX, e.clientY);
  }, { passive: false });

  window.addEventListener("resize", () => {
    resizeCanvas();
    updatePinUI();
  });

  async function init() {
    uiLang = detectLang();
    applyStaticI18n();
    setStatus(t("detecting"));
    await resolveLayers();
    if (!LAYERS.length) throw new Error(t("noLayers"));
    fillSelect();
    try {
      const res = await fetch(TEMP_META_URL);
      if (res.ok) {
        const meta = await res.json();
        if (meta.gray_scale_C) state.tempMeta.gray_scale_C = meta.gray_scale_C;
        if (meta.max_elev_m) state.tempMeta.max_elev_m = meta.max_elev_m;
        if (meta.min_elev_m != null) state.tempMeta.min_elev_m = meta.min_elev_m;
        else if (meta.max_elev_m) state.tempMeta.min_elev_m = -Math.abs(meta.max_elev_m);
        if (meta.freeze_C != null) state.tempMeta.freeze_C = meta.freeze_C;
      }
    } catch (_) { /* defaults */ }
    syncChartAxisFromMeta();

    resizeCanvas();
    await loadGlobalData();
    // Hide contour toggle if no contours
    if (!state.hasContours && els.contourToggle) {
      const lab = els.contourToggle.closest("label");
      if (lab) lab.style.display = "none";
    }
    if (state.hasWindUV || state.hasPressure) {
      try {
        await loadWindUV(windMonthIndexForLayer(state.layer));
      } catch (_) {
        state.hasWindUV = false;
      }
    }
    if (!state.hasWindUV && els.windArrowToggle) {
      const lab = els.windArrowToggle.closest("label");
      if (lab) lab.style.display = "none";
    }
    updateLegend();
    await loadLayer(state.layer);
    const bits = [];
    if (!state.hasSatellite) bits.push(t("noSat"));
    if (!state.hasTemps) bits.push(t("noTemp"));
    if (!state.hasPressure) bits.push(t("noPres"));
    if (!state.hasWindUV) bits.push(t("noWind"));
    setStatus(
      `${layerDisplayName(state.layer)} · ${state.iw}×${state.ih} · ${t("dataReady")}` +
        (bits.length ? ` · ${bits.join(" · ")}` : "")
    );
  }

  init().catch((e) => setStatus(String(e.message || e), true));
})();
  </script>
</body>
</html>
